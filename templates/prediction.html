{% extends "base.html" %}

{% block content %}

<h1 class="page-title">Predictions</h1>

<div class="prediction-container">

<!-- ============================= -->
<!-- Prediction Form -->
<!-- ============================= -->

<div class="prediction-form">

<form method="POST" action="/prediction">

<select name="habit_id" required>

<option value="">Select Habit</option>

{% for habit in habits %}

<option value="{{ habit.id }}">
{{ habit.habit_name }}
</option>

{% endfor %}

</select>


<input
type="number"
name="study_time"
placeholder="Study Time (minutes)"
required
>


<input
type="number"
name="skipped_days"
placeholder="Skipped Days"
required
>


<input
type="number"
name="quiz_score"
placeholder="Quiz Score (0-100)"
required
>


<label>Mood (1-5)</label>

<input
type="range"
name="mood"
min="1"
max="5"
value="3"
>


<label>Focus (1-5)</label>

<input
type="range"
name="focus"
min="1"
max="5"
value="3"
>


<button type="submit" class="btn-primary">
Predict
</button>

</form>

</div>


<!-- ============================= -->
<!-- Prediction Result -->
<!-- ============================= -->

<div class="prediction-result">

{% if prediction_result %}

<h3>Prediction Result</h3>

<p class="prediction-text">
{{ prediction_result }}
</p>

<p class="confidence">
Confidence Level: {{ confidence if confidence else 0 }}%
</p>

<div class="confidence-container">
<div class="confidence-bar" style="width: {{ confidence if confidence else 0 }}%; background:#4CAF50;">
</div>
</div>

{% else %}

<p>Enter study parameters to get prediction.</p>

{% endif %}

</div>

</div>


<!-- ============================= -->
<!-- Confidence Bar Styling -->
<!-- ============================= -->

<style>

.confidence-container{
    width:100%;
    height:20px;
    background:#2c2c2c;
    border-radius:10px;
    margin-top:10px;
    overflow:hidden;
}

.confidence-bar{
    height:100%;
    width:0%;
    border-radius:10px;
    transition:width 0.6s ease;
}

</style>

{% endblock %}
